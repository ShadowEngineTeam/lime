<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="utf-8">

	<title>::APP_TITLE::</title>

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">

	::if favicons::::foreach (favicons)::
	<link rel="::__current__.rel::" type="::__current__.type::" href="::__current__.href::">::end::::end::

	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { passive: false });
	</script>

	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#content { background: #000000; width: 100%; height: 100%; color: #ffffff; font: 20px sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; }
		#canvas { position: absolute; top: 0; left: 0; outline: none; }
	</style>

</head>
<body>

	<div id="content">
		<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault ()"></canvas>
	</div>

	<script type="text/javascript">
		var Module = {};
		Module.canvas = document.getElementById ("canvas");
		Module.setStatus = function (msg) { console.log (msg); };

		var container = document.getElementById ("content");
		Module.canvas.width = container.clientWidth;
		Module.canvas.height = container.clientHeight;

		window.addEventListener ("resize", function (e)
		{
			Module.canvas.width = container.clientWidth;
			Module.canvas.height = container.clientHeight;
		}, true);

		function unsupported (message)
		{
			Module.canvas.remove ();
			container.textContent = message;
		}

		// bgfx renders with WebGPU only. It takes this device instead of requesting one itself, which would need Asyncify.
		if (!window.isSecureContext)
		{
			unsupported ("WebGPU needs this page to be opened over HTTPS or from localhost.");
		}
		else if (!navigator.gpu)
		{
			unsupported ("This browser does not support WebGPU.");
		}
		else
		{
			navigator.gpu.requestAdapter ({ powerPreference: "high-performance" }).then (function (adapter)
			{
				if (!adapter) throw new Error ("No WebGPU adapter");

				var limits = {};
				for (var key in adapter.limits)
				{
					if (typeof adapter.limits[key] === "number") limits[key] = adapter.limits[key];
				}

				return adapter.requestDevice ({ requiredFeatures: Array.from (adapter.features), requiredLimits: limits });
			}).then (function (device)
			{
				Module.preinitializedWebGPUDevice = device;

				var script = document.createElement ("script");
				script.src = "./::APP_FILE::.js";
				document.body.appendChild (script);
			}).catch (function (error)
			{
				console.error (error);
				unsupported ("This browser does not support WebGPU.");
			});
		}
	</script>

</body>
</html>
