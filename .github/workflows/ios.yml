name: iOS CI
on:
  workflow_dispatch:
  workflow_call:

env:
  HAXE_VERSION: 4.3.7

jobs:
  ios:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/ShadowEngineTeam/libhxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format 6e41f83987139febbb078ca5056c9c2f395e99d9 --quiet
          haxelib git hxp https://github.com/openfl/hxp 9019664c287ce1322abac47a7317515511cd21ff --quiet
      - name: Configure Lime
        run: haxelib dev lime ${{ github.workspace }}
      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild ios -arm64 -release -D HXCPP_ARM64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild ios -arm64 -simulator -release -D HXCPP_ARM64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild ios -64 -simulator -release -D HXCPP_M64 -D HXCPP_LTO_THIN
      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: iPhone-NDLL
          path: |
            ndll/iPhone/
            !**/.gitignore
            lime.png
          if-no-files-found: error
