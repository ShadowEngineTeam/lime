name: Mac CI
on:
  workflow_dispatch:
  workflow_call:

env:
  HAXE_VERSION: 4.3.7

jobs:
  mac:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/ShadowEngineTeam/libhxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format 6e41f83987139febbb078ca5056c9c2f395e99d9 --quiet
          haxelib git hxp https://github.com/openfl/hxp 9019664c287ce1322abac47a7317515511cd21ff --quiet
      - name: Configure Lime
        run: haxelib dev lime ${{ github.workspace }}
      - name: Rebuild Lime
        run: |
          # haxelib run lime rebuild mac -32 -release -D HXCPP_M32 -D HXCPP_LTO_THIN
          haxelib run lime rebuild mac -64 -release -D HXCPP_M64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild mac -arm64 -release -D HXCPP_ARM64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild alias -64
          haxelib run lime rebuild alias -arm64
      # - name: Upload Artifact (x86)
        # uses: actions/upload-artifact@main
        # with:
          # name: Mac-NDLL
          # path: |
            # ndll/Mac/
            # !**/.gitignore
            # lime.png
          # if-no-files-found: error
      - name: Upload Artifact (x86_64)
        uses: actions/upload-artifact@main
        with:
          name: Mac64-NDLL
          path: |
            templates/bin/alias/Mac64/
            ndll/Mac64/
            !**/.gitignore
            lime.png
          if-no-files-found: error
      - name: Upload Artifact (arm64)
        uses: actions/upload-artifact@main
        with:
          name: MacArm64-NDLL
          path: |
            templates/bin/alias/MacArm64/
            ndll/MacArm64/
            !**/.gitignore
            lime.png
          if-no-files-found: error
