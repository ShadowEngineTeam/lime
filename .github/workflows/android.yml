name: Android CI
on:
  workflow_dispatch:
  workflow_call:

env:
  HAXE_VERSION: 4.3.7
  NDK_TAG: "r30"
  NDK_VERSION: ""

jobs:
  android:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install Haxe dependencies
        run: |
          haxelib git hxcpp https://github.com/ShadowEngineTeam/libhxcpp --quiet
          haxelib git format https://github.com/HaxeFoundation/format 9d69fb342d030fa120d2deafafbbffad248332b8 --quiet
          haxelib git hxp https://github.com/openfl/hxp 47ef5ae6569cb0961761a2fbb416694df067124c --quiet
      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          detect_host() {
            local os arch libc="${NDK_LIBC:-gnu}"

            case "$(uname -m | tr '[:upper:]' '[:lower:]')" in
              x86_64|amd64)              arch=x86_64 ;;
              i386|i486|i586|i686|x86)   arch=i686 ;;
              aarch64|arm64)             arch=aarch64 ;;
              armv7*|armv8l|armhf)       arch=armv7 ;;
              *) echo "Unsupported arch: $(uname -m)" >&2; return 1 ;;
            esac

            case "$(uname -s)" in
              Linux)
                if [ "$(uname -o 2>/dev/null)" = "Android" ]; then os=android; else os=linux; fi ;;
              Darwin) os=macos ;;
              MINGW*|MSYS*|CYGWIN*) os=windows ;;
              *) echo "Unsupported OS: $(uname -s)" >&2; return 1 ;;
            esac

            case "$os-$arch" in
              linux-x86_64)    echo "x86_64-linux-$libc" ;;
              linux-i686)      echo "x86-linux-$libc" ;;
              linux-aarch64)   echo "aarch64-linux-$libc" ;;
              linux-armv7)     echo "arm-linux-${libc}eabihf" ;;
              android-x86_64)  echo "x86_64-linux-android" ;;
              android-i686)    echo "i686-linux-android" ;;
              android-aarch64) echo "aarch64-linux-android" ;;
              android-armv7)   echo "armv7a-linux-androideabi" ;;
              macos-x86_64)    echo "x86_64-apple-darwin" ;;
              macos-aarch64)   echo "arm64-apple-darwin" ;;
              windows-x86_64)  echo "x86_64-w64-mingw32" ;;
              windows-i686)    echo "i686-w64-mingw32" ;;
              windows-aarch64) echo "aarch64-w64-mingw32" ;;
              *) echo "NDK variant not found for $os-$arch" >&2; return 1 ;;
            esac
          }

          HOST="${ANDROID_HOST:-$(detect_host)}"
          case "$HOST" in *w64-mingw32) EXT=7z ;; *) EXT=tar.xz ;; esac

          BASE=https://github.com/HomuHomu833
          NDK_URL="$BASE/android-ndk-custom/releases/download/${NDK_TAG}/android-ndk-${NDK_TAG}${NDK_VERSION}-${HOST}.${EXT}"

          ROOT="$HOME/android"
          mkdir -p "$ROOT/ndk"

          if [ "$EXT" = "7z" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.7z" "$NDK_URL"
            7z x -y -o"$RUNNER_TEMP/ndk-extract" "$RUNNER_TEMP/ndk.7z" > /dev/null
            shopt -s dotglob
            mv "$RUNNER_TEMP"/ndk-extract/*/* "$ROOT/ndk/"
          else
            curl -fsSL --retry 3 "$NDK_URL" | tar -xJ -C "$ROOT/ndk" --strip-components=1
          fi

          # windows runners need native-style paths
          if command -v cygpath >/dev/null 2>&1; then ROOT="$(cygpath -m "$ROOT")"; fi

          {
            echo "ANDROID_NDK_ROOT=$ROOT/ndk"
            echo "ANDROID_NDK_HOME=$ROOT/ndk"
          } >> "$GITHUB_ENV"
      - name: Configure Lime
        run: |
          haxelib dev lime ${{ github.workspace }}
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME -nocffi
          haxelib run lime config ANDROID_SETUP true -nocffi
      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild android -release -ONLY_ARMV7 -D HXCPP_LTO_THIN
          haxelib run lime rebuild android -release -ONLY_ARM64 -D HXCPP_LTO_THIN
          haxelib run lime rebuild android -release -ONLY_X86 -D HXCPP_LTO_THIN
          haxelib run lime rebuild android -release -ONLY_X86_64 -D HXCPP_LTO_THIN
      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: Android-NDLL
          path: |
            ndll/Android/
            !**/.gitignore
            lime.png
          if-no-files-found: error
